# Perfil MySQL: execute com  --spring.profiles.active=mysql
# Senha vem da variável de ambiente DB_PASSWORD (não grave senhas no GitHub).
spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
