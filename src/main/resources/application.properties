spring.application.name=baozi-store

# ---------- Banco de dados padrão: H2 em arquivo (permitido no enunciado) ----------
# Os dados persistem em ./data/ entre reinícios da aplicação.
spring.datasource.url=jdbc:h2:file:./data/baozidb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ---------- JPA / Hibernate ----------
# update: cria/ajusta as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Datas em ISO-8601 (2026-10-12) em vez de timestamp numérico
spring.jackson.serialization.write-dates-as-timestamps=false
